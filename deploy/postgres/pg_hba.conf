# Local development only. "replication" lets the read replica stream WAL
# (pg_basebackup + physical replication); "all" covers normal and logical
# (CDC relay) connections.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
