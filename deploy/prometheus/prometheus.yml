# Scrapes the API and the indexer. Start with:
#   docker compose --profile observability up -d
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8080"]}]
  - job_name: workers
    static_configs:
      - targets: ["relay:9091", "consumer-search:9091", "consumer-timeline:9091", "consumer-stats:9091"]
  - job_name: indexer # poll mode only
    static_configs: [{targets: ["indexer:9091"]}]
