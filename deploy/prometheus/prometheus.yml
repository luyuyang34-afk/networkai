# Scrapes the API and the indexer. Start with:
#   docker compose --profile observability up -d
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8080"]}]
  - job_name: indexer
    static_configs: [{targets: ["indexer:9091"]}]
