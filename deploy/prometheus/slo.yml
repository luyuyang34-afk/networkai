# Service level objectives (docs/slo.md). Generated by the multiwindow,
# multi-burn-rate method of the Google SRE Workbook, chapter 5.
#
#   page:   2% of the 30-day budget in 1h   (burn 14.4x, confirmed over 5m)
#           5% of the budget in 6h          (burn 6x,    confirmed over 30m)
#   ticket: 10% of the budget in 1d         (burn 3x,    confirmed over 2h)
#           10% of the budget in 3d         (burn 1x,    confirmed over 6h)
#
# The short window makes an alert stop soon after the problem stops.
groups:
  - name: slo-recording
    rules:
      - record: slo:api_errors:ratio_rate5m
        expr: |
          sum(rate(networkai_http_requests_total{status=~"5..",route!~"GET /(healthz|readyz)"}[5m]))
            / sum(rate(networkai_http_requests_total{route!~"GET /(healthz|readyz)"}[5m]))
      - record: slo:read_latency_slow:ratio_rate5m
        expr: |
          1 - sum(rate(networkai_http_request_duration_seconds_bucket{le="0.25",route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[5m]))
            / sum(rate(networkai_http_request_duration_seconds_count{route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[5m]))
      - record: slo:api_errors:ratio_rate30m
        expr: |
          sum(rate(networkai_http_requests_total{status=~"5..",route!~"GET /(healthz|readyz)"}[30m]))
            / sum(rate(networkai_http_requests_total{route!~"GET /(healthz|readyz)"}[30m]))
      - record: slo:read_latency_slow:ratio_rate30m
        expr: |
          1 - sum(rate(networkai_http_request_duration_seconds_bucket{le="0.25",route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[30m]))
            / sum(rate(networkai_http_request_duration_seconds_count{route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[30m]))
      - record: slo:api_errors:ratio_rate1h
        expr: |
          sum(rate(networkai_http_requests_total{status=~"5..",route!~"GET /(healthz|readyz)"}[1h]))
            / sum(rate(networkai_http_requests_total{route!~"GET /(healthz|readyz)"}[1h]))
      - record: slo:read_latency_slow:ratio_rate1h
        expr: |
          1 - sum(rate(networkai_http_request_duration_seconds_bucket{le="0.25",route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[1h]))
            / sum(rate(networkai_http_request_duration_seconds_count{route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[1h]))
      - record: slo:api_errors:ratio_rate2h
        expr: |
          sum(rate(networkai_http_requests_total{status=~"5..",route!~"GET /(healthz|readyz)"}[2h]))
            / sum(rate(networkai_http_requests_total{route!~"GET /(healthz|readyz)"}[2h]))
      - record: slo:read_latency_slow:ratio_rate2h
        expr: |
          1 - sum(rate(networkai_http_request_duration_seconds_bucket{le="0.25",route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[2h]))
            / sum(rate(networkai_http_request_duration_seconds_count{route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[2h]))
      - record: slo:api_errors:ratio_rate6h
        expr: |
          sum(rate(networkai_http_requests_total{status=~"5..",route!~"GET /(healthz|readyz)"}[6h]))
            / sum(rate(networkai_http_requests_total{route!~"GET /(healthz|readyz)"}[6h]))
      - record: slo:read_latency_slow:ratio_rate6h
        expr: |
          1 - sum(rate(networkai_http_request_duration_seconds_bucket{le="0.25",route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[6h]))
            / sum(rate(networkai_http_request_duration_seconds_count{route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[6h]))
      - record: slo:api_errors:ratio_rate1d
        expr: |
          sum(rate(networkai_http_requests_total{status=~"5..",route!~"GET /(healthz|readyz)"}[1d]))
            / sum(rate(networkai_http_requests_total{route!~"GET /(healthz|readyz)"}[1d]))
      - record: slo:read_latency_slow:ratio_rate1d
        expr: |
          1 - sum(rate(networkai_http_request_duration_seconds_bucket{le="0.25",route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[1d]))
            / sum(rate(networkai_http_request_duration_seconds_count{route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[1d]))
      - record: slo:api_errors:ratio_rate3d
        expr: |
          sum(rate(networkai_http_requests_total{status=~"5..",route!~"GET /(healthz|readyz)"}[3d]))
            / sum(rate(networkai_http_requests_total{route!~"GET /(healthz|readyz)"}[3d]))
      - record: slo:read_latency_slow:ratio_rate3d
        expr: |
          1 - sum(rate(networkai_http_request_duration_seconds_bucket{le="0.25",route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[3d]))
            / sum(rate(networkai_http_request_duration_seconds_count{route=~"GET /posts|GET /posts/\\{id\\}|GET /timeline|GET /users/\\{username\\}"}[3d]))
  - name: slo-alerts
    rules:
      - alert: APIAvailabilityBudgetBurnFast
        expr: |
          (slo:api_errors:ratio_rate1h > 14.4 * 0.001 and slo:api_errors:ratio_rate5m > 14.4 * 0.001)
            or (slo:api_errors:ratio_rate6h > 6 * 0.001 and slo:api_errors:ratio_rate30m > 6 * 0.001)
        labels: {severity: page, slo: api-availability}
        annotations:
          summary: "API availability (99.9%): error budget burning fast (2% of 30 days in 1h, or 5% in 6h)"
          runbook: "docs/slo.md#api-availability"
      - alert: APIAvailabilityBudgetBurnSlow
        expr: |
          (slo:api_errors:ratio_rate1d > 3 * 0.001 and slo:api_errors:ratio_rate2h > 3 * 0.001)
            or (slo:api_errors:ratio_rate3d > 1 * 0.001 and slo:api_errors:ratio_rate6h > 1 * 0.001)
        labels: {severity: ticket, slo: api-availability}
        annotations:
          summary: "API availability (99.9%): error budget burning (10% of 30 days in 1d or 3d)"
          runbook: "docs/slo.md#api-availability"
      - alert: ReadLatencyBudgetBurnFast
        expr: |
          (slo:read_latency_slow:ratio_rate1h > 14.4 * 0.01 and slo:read_latency_slow:ratio_rate5m > 14.4 * 0.01)
            or (slo:read_latency_slow:ratio_rate6h > 6 * 0.01 and slo:read_latency_slow:ratio_rate30m > 6 * 0.01)
        labels: {severity: page, slo: read-latency}
        annotations:
          summary: "Read latency (99% under 250 ms): error budget burning fast (2% of 30 days in 1h, or 5% in 6h)"
          runbook: "docs/slo.md#read-latency"
      - alert: ReadLatencyBudgetBurnSlow
        expr: |
          (slo:read_latency_slow:ratio_rate1d > 3 * 0.01 and slo:read_latency_slow:ratio_rate2h > 3 * 0.01)
            or (slo:read_latency_slow:ratio_rate3d > 1 * 0.01 and slo:read_latency_slow:ratio_rate6h > 1 * 0.01)
        labels: {severity: ticket, slo: read-latency}
        annotations:
          summary: "Read latency (99% under 250 ms): error budget burning (10% of 30 days in 1d or 3d)"
          runbook: "docs/slo.md#read-latency"
