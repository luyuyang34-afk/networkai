name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: networkai
          POSTGRES_PASSWORD: networkai
          POSTGRES_DB: networkai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U networkai"
          --health-interval 2s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-retries 30
      elasticsearch:
        image: elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs localhost:9200/_cluster/health"
          --health-interval 5s --health-retries 40
    env:
      TEST_DATABASE_URL: postgres://networkai:networkai@localhost:5432/networkai?sslmode=disable
      TEST_ES_URL: http://localhost:9200
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_KAFKA_BROKERS: localhost:9092
      TEST_REPLICA_URL: postgres://networkai:networkai@localhost:5433/networkai?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      # Service containers cannot take a command, so CDC prerequisites are
      # set up here: logical WAL for PostgreSQL, and a Redpanda broker.
      - name: enable logical replication and start redpanda
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U networkai -c "ALTER SYSTEM SET wal_level = logical"
          docker exec ${{ job.services.postgres.id }} sh -c 'echo "host replication all all scram-sha-256" >> "$PGDATA/pg_hba.conf"'
          docker restart ${{ job.services.postgres.id }}
          docker run -d --name redpanda -p 9092:9092 redpandadata/redpanda:v24.2.7 redpanda start \
            --mode dev-container --smp 1 --memory 1G --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092
          for i in $(seq 1 60); do
            docker exec ${{ job.services.postgres.id }} pg_isready -U networkai >/dev/null 2>&1 \
              && docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && break
            sleep 2
          done
          docker exec ${{ job.services.postgres.id }} psql -U networkai -Atc "show wal_level"
          # A read replica that applies WAL 2 s late, so tests can reproduce
          # replication-lag bugs deterministically.
          docker run -d --name replica --network ${{ job.services.postgres.network }} -p 5433:5432 \
            -e POSTGRES_USER=networkai -e POSTGRES_PASSWORD=networkai -e PRIMARY_HOST=postgres \
            -e REPLICA_APPLY_DELAY=2s \
            -v $PWD/deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro \
            -v $PWD/deploy/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro \
            --entrypoint /replica-entrypoint.sh postgres:16-alpine
          for i in $(seq 1 60); do docker exec replica pg_isready -U networkai >/dev/null 2>&1 && break; sleep 2; done
          docker exec replica psql -U networkai -Atc "select pg_is_in_recovery()"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: test (unit + integration, race detector)
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=cover.out ./...
      - name: coverage
        run: go tool cover -func=cover.out | tail -1
      - name: docker build
        run: docker build -t networkai .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # Full stack: docker compose (postgres, elasticsearch, api, indexer) plus
    # the production Next.js build, driven by Playwright.
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: start backend
        run: docker compose up -d --build --wait
      - name: seed
        run: ./scripts/seed.sh
      - name: build web
        working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: playwright
        working-directory: web
        run: npx playwright test
      - name: backend logs on failure
        if: failure()
        run: docker compose logs api indexer | tail -200
